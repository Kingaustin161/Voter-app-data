name: Refresh candidate data

on:
  schedule:
    - cron: '0 13 * * *'   # every day at 13:00 UTC (~9am Eastern)
  workflow_dispatch:        # adds a "Run workflow" button for manual testing

permissions:
  contents: write            # allows this workflow to commit the updated file back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the data refresh script
        env:
          OPENFEC_API_KEY: ${{ secrets.OPENFEC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python refresh_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Daily data refresh" || echo "No changes to commit"
          git push
